[workspace]
members = [".", "crates/rav1d-disjoint-mut"]
# `apidoc/` is the CI-free public-API snapshot runner package (depends on
# zenutils-apidoc); excluded so plain `cargo test` and CI never build it.
exclude = ["fuzz", "apidoc"]

[package]
name = "rav1d-safe"
authors = ["Rav1d Developers", "Prossimo", "Imazen"]
version = "0.6.0"
edition = "2024"
rust-version = "1.89"
description = "Safe SIMD fork of rav1d - Rust AV1 decoder with archmage intrinsics"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
repository = "https://github.com/imazen/rav1d-safe"
readme = "README.md"
keywords = ["av1", "video", "decoder", "simd", "codec"]
categories = ["multimedia::video", "multimedia::encoding"]
include = [
    "/src/**/*.rs",
    "/include/**/*.rs",
    "/lib.rs",
    "/build.rs",
    "/examples/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE*",
]

[lib]
path = "lib.rs"
crate-type = ["rlib"]

[dependencies]
aligned = "0.4"
assert_matches = "1.5.0"
whereat = "0.1.5"
atomig = { version = "0.4.1", features = ["derive"] }
bitflags = "2.4.0"
cfg-if = "1.0.0"
# Cooperative cancellation token (issue #412). no_std trait crate; the `Stop`
# trait is Send+Sync and object-safe, so we store `Arc<dyn Stop>` in the context.
enough = "0.4.4"
rav1d-disjoint-mut = { version = "0.3.1", path = "crates/rav1d-disjoint-mut", default-features = false, features = ["std", "aligned", "pic-buf", "zerocopy"] }
libc = { version = "0.2", optional = true }
parking_lot = "0.12.2"
paste = "1.0.14"
raw-cpuid = "11.0.1"
strum = { version = "0.28", features = ["derive"] }
to_method = "1.1.0"
zerocopy = { version = "0.8", features = ["derive", "alloc"] }

# Safe SIMD dependencies
archmage = { version = "0.9.15", features = ["macros", "avx512"] }
safe_unaligned_simd = { version = "0.2.5", features = ["avx512"] }

[dev-dependencies]
archmage = { version = "0.9.15", features = ["macros", "avx512", "testable_dispatch"] }
divan = "0.1"
md5 = "0.8.0"
zenbench = "0.1.2"
zenavif-parse = { version = "0.5.1", features = ["eager"] }

# tango-bench depends on libloading which doesn't support wasm32
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tango-bench = "0.7"

[build-dependencies]
cc = "1.0.79"
nasm-rs = { version = "0.3", features = ["parallel"] }

[features]
# Default: forbid(unsafe_code), multithreaded, bounds-checked
default = ["bitdepth_8", "bitdepth_16"]

# Unchecked slice access in hot paths (get_unchecked with debug_assert!).
# Also disables DisjointMut runtime overlap checking for hot-path
# instances (PicBuf, ArcSlice) via dangerously_unchecked().
unchecked = []

# THROWAWAY measurement probes (recon/tracker-profile branch). Never merge.
probe-count = ["rav1d-disjoint-mut/__probe_count"]
probe-wide = ["rav1d-disjoint-mut/__probe_wide"]
probe-sites = ["rav1d-disjoint-mut/__probe_sites"]
# Measurement-only: arms `RAV1D_LF_HULL=1`, which makes the loop filter take one
# strided-hull read guard instead of `h` per-row ones under tile threading.
# Absent from `default` and from every published feature. See
# `src/loopfilter.rs::lf_hull_reads` and docs/MUT_RECON_KERNELS.md section 10.
__probe_lf_hull = []
# Measurement-only: counts `LfBlock::fill`'s registrations split by direction
# (H = vertical edges, `filter_plane_cols_*`; V = horizontal edges,
# `filter_plane_rows_*`) and by run length, so the site's population can be
# attributed before anything is built against it. Counts only, never a policy.
__probe_lf_hist = []
probe-tinynop = ["rav1d-disjoint-mut/__probe_tinynop"]
probe-addnop = ["rav1d-disjoint-mut/__probe_addnop"]
probe-noscan = ["rav1d-disjoint-mut/__probe_noscan"]
probe-lockonly = ["rav1d-disjoint-mut/__probe_lockonly"]
# Tracking off, bounds checks untouched (isolates the tracker from `unchecked`).
probe-untracked = ["rav1d-disjoint-mut/__probe_untracked"]
probe-shardsim = ["probe-count", "rav1d-disjoint-mut/__probe_shardsim"]
# Per-worker, per-task-stage timing + a sampled concurrency histogram (P1).
probe-tasktime = []
# probe-tasktime composed with the tracker removed: the ceiling's task profile.
probe-tasktime-untracked = ["probe-tasktime", "probe-untracked"]
# (The `probe-nodeblockgate` family that ablated the `check_tile` deblock
# barrier is gone with the barrier itself — 054e2ed. Its measurements are in
# benchmarks/p1_scaling_2026-08-07.meta and p1_barrier_2026-08-07.meta.)

# Sharded-tracker A/B knobs. Compile-time only; the defaults are the measured
# winners (benchmarks/shard_tracker_2026-08-07.meta).
# A/B baseline: the pre-sharding single-lock tracker, no probe hooks.
tracker-legacy = ["rav1d-disjoint-mut/__tracker_legacy"]
shards-1 = ["rav1d-disjoint-mut/__shards_1"]
shards-4 = ["rav1d-disjoint-mut/__shards_4"]
shards-8 = ["rav1d-disjoint-mut/__shards_8"]
shards-16 = ["rav1d-disjoint-mut/__shards_16"]
probe-lock-backoff = ["rav1d-disjoint-mut/__probe_lock_backoff"]
shards-32 = ["rav1d-disjoint-mut/__shards_32"]
shards-64 = ["rav1d-disjoint-mut/__shards_64"]
shards-128 = ["rav1d-disjoint-mut/__shards_128"]
shards-256 = ["rav1d-disjoint-mut/__shards_256"]
# A/B: BlockMut holds its per-row MUTABLE guards across the kernel instead of
# taking immutable ones to read and mutable ones to write back (2h -> h
# registrations). MEASURED NULL — see the doc comment on `block_mut_held`.
held-row-guards = []
shard-ident = ["rav1d-disjoint-mut/__shard_ident"]
blockshift-8 = ["rav1d-disjoint-mut/__blockshift_8"]
blockshift-10 = ["rav1d-disjoint-mut/__blockshift_10"]
blockshift-13 = ["rav1d-disjoint-mut/__blockshift_13"]
blockshift-14 = ["rav1d-disjoint-mut/__blockshift_14"]
blockshift-15 = ["rav1d-disjoint-mut/__blockshift_15"]
blockshift-16 = ["rav1d-disjoint-mut/__blockshift_16"]
blockshift-adaptive = ["rav1d-disjoint-mut/__blockshift_adaptive"]

# Test-only (double-underscore = private, never enable in production): arms a
# one-shot worker-thread panic so tests can prove a worker death surfaces as a
# decode error instead of wedging every completion wait (zenavif#30). See
# `thread_task::TEST_INDUCE_WORKER_PANIC` and tests/worker_panic_recovery.rs.
__test_induce_worker_panic = []

# C FFI API compatibility (unsafe extern "C" functions)
# Enables: dav1d_* C API, FFISafe, c_arc, c_box
c-ffi = ["unchecked", "dav1d-compat", "libc"]

# Export C symbols as dav1d_* (drop-in replacement for libdav1d).
# When disabled, symbols are exported as rav1d_* for side-by-side benchmarking.
dav1d-compat = []

# Hand-written ASM for entropy decoding (msac) and loopfilter only.
# Everything else stays in safe Rust SIMD.
partial_asm = ["unchecked"]

# Level 4: Hand-written assembly (maximum performance)
asm = ["c-ffi"]
asm_arm64_dotprod = ["asm"]
asm_arm64_i8mm = ["asm"]
asm_arm64_sve2 = ["asm"]


# Run SIMD and scalar side-by-side, panic on any mismatch (testing only)
__simd_test = []
# Temporary measurement-only: print each (bitdepth, LR variant) pair the first
# time it is dispatched, so a __simd_test run can prove which variants it covered.
__lrvarcov = []
# Temporary measurement-only: fill the loop-restoration scratch with a non-zero
# pattern before every call, so the __simd_test differential catches any
# read-before-write the reused (never-cleared) scratch would otherwise hide.
__lrpoison = []

# Per-kernel-family SIMD ablation (measurement only, see src/ablate.rs). Arms a
# process-global "disabled families" bitmask that each aarch64 SIMD dispatcher
# consults at entry, so a disabled family falls through to the generic scalar
# reference. This is the causal attribution tool: ablate family X, re-run the
# conformance corpus, and the vectors that flip to PASS are X's. Compile-time
# gated so a production build has no atomic load on the dispatch path.
__ablate = []

# Like __simd_test but LOG every mismatch and continue instead of panicking, for a
# one-pass cross-module bit-exactness inventory. Compile-time so there is no
# per-mismatch env-var read. (implies __simd_test)
__simd_test_log = ["__simd_test"]

# Bit depth support
bitdepth_8 = []
bitdepth_16 = []

[[bench]]
name = "tier_isolation"
harness = false

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "decode_avif"
harness = false

[[bench]]
name = "tango_decode"
harness = false

[[bench]]
name = "threading_bench"
harness = false

[[bench]]
name = "tile_threading"
harness = false

[[bench]]
name = "checked_vs_unchecked"
harness = false

[profile.bench]
codegen-units = 1
lto = "fat"

[profile.dev]
panic = "abort"

[profile.opt-dev]
inherits = "dev"
opt-level = 1

[profile.release]
codegen-units = 1
# panic = "abort" is intentionally NOT set here: a parser panic on a
# malformed AV1 bitstream must NOT terminate the host process. Library
# consumers (image servers, browsers, decoders) need the ability to
# catch_unwind around decode and recover.
lto = "fat"
strip = false
debug = "line-tables-only"

[profile.release-with-debug]
inherits = "release"
debug = "line-tables-only"

[profile.checked-release]
inherits = "dev"
opt-level = 2
codegen-units = 16
