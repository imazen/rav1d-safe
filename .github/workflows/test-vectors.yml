name: Test Vectors

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
    # Full Argon conformance sweep: 1st of the month at 3 AM UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      corpus:
        description: 'Which test corpus to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - dav1d-only
          - fluster-only
          - argon-only

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Quick smoke test - dav1d-test-data (109 MB, ~160k files)
  test-dav1d:
    name: Test dav1d-test-data
    runs-on: ubuntu-latest
    if: github.event.inputs.corpus == 'all' || github.event.inputs.corpus == 'dav1d-only' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Build decoder
        run: cargo build --release --example managed_decode --no-default-features --features "bitdepth_8,bitdepth_16"

      - name: Download dav1d test vectors
        run: |
          mkdir -p test-vectors
          cd test-vectors
          if [ ! -d dav1d-test-data ]; then
            git clone --depth 1 https://code.videolan.org/videolan/dav1d-test-data.git
          fi

      - name: Cache dav1d vectors
        uses: actions/cache@v5
        with:
          path: test-vectors/dav1d-test-data
          key: dav1d-vectors-${{ hashFiles('scripts/download-test-vectors.sh') }}

      - name: Test 8-bit samples (100 files)
        run: |
          PASS=0
          FAIL=0
          TOTAL=0
          for ivf in $(find test-vectors/dav1d-test-data/8-bit -name "*.ivf" -o -name "*.obu" 2>/dev/null | head -100 || true); do
            ((TOTAL++)) || true
            if timeout 30 cargo run --release --example managed_decode --no-default-features \
                --features "bitdepth_8,bitdepth_16" -- "$ivf" > /dev/null 2>&1; then
              ((PASS++)) || true
            else
              ((FAIL++)) || true
              echo "FAIL: $ivf"
            fi
          done
          echo "Results: $PASS/$TOTAL passed, $FAIL failed"
          [ $FAIL -lt 10 ] || exit 1  # Allow up to 10 failures for now

      - name: Test 10-bit samples (50 files)
        run: |
          PASS=0
          FAIL=0
          TOTAL=0
          for ivf in $(find test-vectors/dav1d-test-data/10-bit -name "*.ivf" -o -name "*.obu" 2>/dev/null | head -50 || true); do
            ((TOTAL++)) || true
            if timeout 30 cargo run --release --example managed_decode --no-default-features \
                --features "bitdepth_8,bitdepth_16" -- "$ivf" > /dev/null 2>&1; then
              ((PASS++)) || true
            else
              ((FAIL++)) || true
              echo "FAIL: $ivf"
            fi
          done
          echo "Results: $PASS/$TOTAL passed, $FAIL failed"
          [ $FAIL -lt 5 ] || exit 1

      - name: Test 12-bit samples (50 files)
        run: |
          PASS=0
          FAIL=0
          TOTAL=0
          for ivf in $(find test-vectors/dav1d-test-data/12-bit -name "*.ivf" -o -name "*.obu" 2>/dev/null | head -50 || true); do
            ((TOTAL++)) || true
            if timeout 30 cargo run --release --example managed_decode --no-default-features \
                --features "bitdepth_8,bitdepth_16" -- "$ivf" > /dev/null 2>&1; then
              ((PASS++)) || true
            else
              ((FAIL++)) || true
              echo "FAIL: $ivf"
            fi
          done
          echo "Results: $PASS/$TOTAL passed, $FAIL failed"
          [ $FAIL -lt 5 ] || exit 1

  # Medium test - Fluster AV1 vectors (17 MB, ~312 files)
  test-fluster:
    name: Test Fluster AV1 Vectors
    runs-on: ubuntu-latest
    if: github.event.inputs.corpus == 'all' || github.event.inputs.corpus == 'fluster-only' || github.event_name == 'schedule'
    needs: test-dav1d  # Run after dav1d to save resources
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Build decoder
        run: cargo build --release --example managed_decode --no-default-features --features "bitdepth_8,bitdepth_16"

      - name: Download Fluster test vectors
        run: |
          mkdir -p test-vectors
          cd test-vectors
          if [ ! -d fluster ]; then
            git clone --depth 1 https://github.com/fluendo/fluster.git
          fi
          cd fluster
          # Download AV1-TEST-VECTORS
          ./fluster.py download AV1-TEST-VECTORS -j 4 || true

      - name: Cache Fluster vectors
        uses: actions/cache@v5
        with:
          path: test-vectors/fluster
          key: fluster-vectors-v1

      - name: Test AV1-TEST-VECTORS (all files)
        run: |
          PASS=0
          FAIL=0
          TOTAL=0
          VECTORS_DIR="test-vectors/fluster/resources/test_vectors/av1"
          
          for suite in AV1-TEST-VECTORS CHROMIUM-8bit-AV1-TEST-VECTORS CHROMIUM-10bit-AV1-TEST-VECTORS; do
            if [ -d "$VECTORS_DIR/$suite" ]; then
              echo "Testing $suite..."
              for ivf in $(find "$VECTORS_DIR/$suite" -name "*.ivf" -o -name "*.obu"); do
                ((TOTAL++)) || true
                if timeout 60 cargo run --release --example managed_decode --no-default-features \
                    --features "bitdepth_8,bitdepth_16" -- "$ivf" > /dev/null 2>&1; then
                  ((PASS++)) || true
                else
                  ((FAIL++)) || true
                  echo "FAIL: $ivf"
                fi
              done
            fi
          done
          
          echo "Overall Results: $PASS/$TOTAL passed, $FAIL failed"
          echo "Pass rate: $(( PASS * 100 / TOTAL ))%"
          [ $FAIL -lt 50 ] || exit 1  # Allow some failures

  # Full Argon conformance suite (official AOM CWG release, ~7 GB zip,
  # ~3.6k streams) — monthly + manual.
  # Verifies decoder output bit-for-bit against the shipped reference MD5s:
  # both the film-grain (md5_ref) and no-grain (md5_no_film_grain) sidecars.
  #
  # Source: gitlab.com/AOMediaCodec/argon-streams, released at
  # aom-cwg-av1-argon-streams-public.s3.us-east-1.amazonaws.com — set the
  # ARGON_VECTORS_URL repo variable to fetch the internal R2 mirror instead.
  # The suite runs once per ISA tier on both arches, sharded 6 ways to keep
  # each leg under the 6h job limit on 4-vCPU runners. `x86-v2` is omitted:
  # in the default safe-SIMD build it is an alias for scalar (nothing reads
  # the SSE2/SSSE3/SSE4.1 flags), so it would only duplicate the scalar leg.
  prep-argon:
    name: Fetch Argon suite
    runs-on: ubuntu-latest
    if: |
      (github.event.inputs.corpus == 'all' || github.event.inputs.corpus == 'argon-only')
      || (github.event_name == 'schedule' && github.event.schedule == '0 3 1 * *')
    steps:
      - uses: actions/checkout@v6

      - name: Restore Argon vectors
        uses: actions/cache@v5
        with:
          path: test-vectors/argon
          key: argon-extracted-v2

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      # vars.ARGON_VECTORS_URL points at the internal R2 mirror once uploaded;
      # until then this falls back to the official AOM CWG S3 release.
      - name: Download Argon conformance suite
        env:
          ARGON_URL: ${{ vars.ARGON_VECTORS_URL || 'https://aom-cwg-av1-argon-streams-public.s3.us-east-1.amazonaws.com/argon_coveragetool_av1_base_and_extended_profiles_v2.1.1.zip' }}
        run: bash scripts/download-argon.sh test-vectors/argon

  test-argon:
    name: Argon (${{ matrix.isa }} shard ${{ matrix.shard }})
    needs: prep-argon
    runs-on: ${{ contains(matrix.isa, 'arm-') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    if: |
      (github.event.inputs.corpus == 'all' || github.event.inputs.corpus == 'argon-only')
      || (github.event_name == 'schedule' && github.event.schedule == '0 3 1 * *')
    strategy:
      fail-fast: false
      matrix:
        isa:
          - x86-scalar
          - x86-v3
          - x86-v4
          - x86-native
          - arm-scalar
          - arm-neon
          - arm-native
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Restore Argon vectors
        uses: actions/cache@v5
        with:
          path: test-vectors/argon
          key: argon-extracted-v2

      # CpuLevel is a clamp on detected features, not a force: --level v4 on
      # non-AVX-512 silicon would silently re-test v3. Skip instead so the
      # result is honest.
      - name: Gate on ISA availability
        id: gate
        run: |
          ok=true
          if [ "${{ matrix.isa }}" = "x86-v4" ] && \
             ! { grep -qw avx512f /proc/cpuinfo && grep -qw avx512bw /proc/cpuinfo; }; then
            ok=false
            echo "::warning title=ISA gate::x86-v4 leg skipped — runner lacks AVX-512 F/BW"
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Build decoder
        if: steps.gate.outputs.ok == 'true'
        run: cargo build --release --example decode_md5 --no-default-features --features "bitdepth_8,bitdepth_16"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      # Reference MD5s were generated with dav1d (conceal-and-continue)
      # semantics, so verification runs --lenient. A handful of synthesized
      # coverage streams are deliberately non-conforming (e.g. segment_id
      # beyond LastActiveSegId, AV1 §6.10.8) and are correctly rejected by
      # the default Strictness::Strict; the script reports those separately.
      - name: Verify Argon shard bit-exactly
        if: steps.gate.outputs.ok == 'true'
        run: |
          LEVEL="${{ matrix.isa }}"
          LEVEL="${LEVEL#*-}"
          # Extracted root is the versioned argon_coveragetool_*/ dir
          # (or argon/ for the older videolan tarball).
          ARGON_ROOT="$(find test-vectors/argon -mindepth 1 -maxdepth 1 -type d | head -1)"
          echo "ISA=${{ matrix.isa }} -> decode_md5 --level $LEVEL on $ARGON_ROOT"
          ARGON_LEVEL="$LEVEL" \
          ARGON_SHARD="${{ matrix.shard }}" \
          ARGON_SHARDS=6 \
            bash scripts/argon_md5_check.sh \
              "$ARGON_ROOT" \
              ./target/release/examples/decode_md5

      - name: Disk space after test
        run: df -h

  # Panic safety tests with sanitizers
  test-sanitizers:
    name: Memory Safety Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Run panic safety tests
        run: cargo test --no-default-features --features "bitdepth_8,bitdepth_16" --test panic_safety_test --release

      - name: Run tests with AddressSanitizer
        run: |
          RUSTFLAGS="-Z sanitizer=address" \
          cargo +nightly test --no-default-features --features "bitdepth_8,bitdepth_16" \
            --target x86_64-unknown-linux-gnu --lib --release
        continue-on-error: true  # ASAN may have false positives initially

      - name: Run tests with LeakSanitizer
        run: |
          RUSTFLAGS="-Z sanitizer=leak" \
          cargo +nightly test --no-default-features --features "bitdepth_8,bitdepth_16" \
            --target x86_64-unknown-linux-gnu --lib --release
        continue-on-error: true  # LSAN may have false positives initially
