name: CI

on:
  push:
    branches: [ main, feat/*, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Superseded runs only waste runner queue — particularly the macOS
# jobs, which wait on GitHub's scarcest pool. Only the newest
# commit's run matters per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Primary build + test matrix
  # ==========================================================================
  build-test:
    name: Build & Test (${{ matrix.os }}, ${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Safe-SIMD builds (no asm)
          - os: ubuntu-latest
            features: "bitdepth_8,bitdepth_16"
            label: safe-simd
          - os: windows-latest
            features: "bitdepth_8,bitdepth_16"
            label: safe-simd
          - os: macos-latest
            features: "bitdepth_8,bitdepth_16"
            label: safe-simd

          # Native ARM (NEON) — tests safe SIMD on real hardware
          - os: ubuntu-24.04-arm
            features: "bitdepth_8,bitdepth_16"
            label: safe-simd-arm64
          - os: windows-11-arm
            features: "bitdepth_8,bitdepth_16"
            label: safe-simd-arm64

          # macOS Intel (x86_64) — catch Intel-specific issues
          - os: macos-15-intel
            features: "bitdepth_8,bitdepth_16"
            label: safe-simd

          # ASM builds (original hand-written assembly, x86_64 only)
          - os: ubuntu-latest
            features: "asm,bitdepth_8,bitdepth_16"
            label: asm

          # 32-bit builds (safe-simd, no SIMD dispatch — exercises scalar paths)
          - os: ubuntu-latest
            features: "bitdepth_8,bitdepth_16"
            label: i686
            target: i686-unknown-linux-gnu
          - os: windows-latest
            features: "bitdepth_8,bitdepth_16"
            label: i686
            target: i686-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install target
        if: matrix.target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install NASM (Linux)
        if: runner.os == 'Linux' && contains(matrix.features, 'asm')
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install NASM (macOS)
        if: runner.os == 'macOS' && contains(matrix.features, 'asm')
        run: brew install nasm

      - name: Install NASM (Windows)
        if: runner.os == 'Windows' && contains(matrix.features, 'asm')
        run: choco install nasm

      - name: Install 32-bit toolchain (Linux)
        if: matrix.label == 'i686' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Build (debug)
        run: cargo build --no-default-features --features "${{ matrix.features }}" ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Build (release)
        run: cargo build --no-default-features --features "${{ matrix.features }}" --release ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Run unit tests
        run: cargo nextest run --profile ci --no-default-features --features "${{ matrix.features }}" --release --lib ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # Committed-vector integration tests — no download needed, run on every
      # platform (incl. native arm64) as a HARD gate. decode_md5_committed pins
      # cross-arch bit-exact decode (issue #400: aarch64 NEON itx must match the
      # x86 reference); safe_simd_crashes covers the arm SGR/itx fallback paths
      # (issue #14). These catch arch-specific decoder divergence in CI.
      - name: Run committed-vector decode tests (cross-arch correctness)
        run: cargo nextest run --profile ci --no-default-features --features "${{ matrix.features }}" --release --test decode_md5_committed --test safe_simd_crashes ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # SIMD-vs-spec bit-exactness gate (issue #400). The `__simd_test` feature makes
      # every inverse-transform call dual-compute SIMD and the generic scalar itx
      # and assert they're identical. Running it over the committed vectors guards
      # the aarch64 NEON itx (and x86 itx) against any future non-bit-exact drift —
      # a stronger check than the final MD5 alone. Hard gate (passes today).
      - name: Run itx NEON/SIMD bit-exactness check (__simd_test)
        run: cargo nextest run --profile ci --no-default-features --features "${{ matrix.features }},__simd_test" --release --test decode_md5_committed ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # Download test vectors and run the full dav1d MD5 conformance. Runs on x86
      # AND native arm64 (safe-simd-arm64) — the comprehensive aarch64 regression
      # guard (issue #414).
      #
      # 2026-08-11: BOTH `continue-on-error`s removed and a t=8 leg added. The
      # old comment justified them with "aarch64 is not yet fully conformant
      # (mc_arm 8-tap OOB on inter frames)" — that is stale. The corpus now
      # passes 766/766 on aarch64 AND x86_64 at t=1, and 766/766 at t=8 on
      # aarch64, with nothing skipped (#455 campaign; 302/766 at its start).
      #
      # Both flags together made this gate unable to report anything: a failed
      # download fell through to a run with no vectors, which then also could
      # not fail. And `Settings::default()` is `threads: 1`, so the only leg
      # that ran had NO tile-threading coverage — which is precisely why the
      # x86_64 t=8 deblock race (#494/#497) reached main. The t=8 leg below is
      # the cheapest thing that would have caught it.
      #
      # The download is retried instead of ignored: a network flake should cost
      # a retry, not silently disarm the conformance suite.
      - name: Download test vectors
        if: (matrix.label == 'safe-simd' || matrix.label == 'safe-simd-arm64') && runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            if bash scripts/download-test-vectors.sh; then exit 0; fi
            echo "download-test-vectors.sh failed (attempt $attempt/3); retrying in $((attempt * 10))s" >&2
            sleep $((attempt * 10))
          done
          echo "download-test-vectors.sh failed after 3 attempts" >&2
          exit 1

      - name: Run MD5 decode parity tests (t=1)
        if: (matrix.label == 'safe-simd' || matrix.label == 'safe-simd-arm64') && runner.os == 'Linux'
        run: cargo nextest run --profile ci --no-default-features --features "${{ matrix.features }}" --release --test decode_md5_verify

      # Tile-threaded conformance. Same 766 vectors, same expected MD5s — a
      # decode that changes with the worker count is a bug in the threading, and
      # this is the gate that says so. `RAV1D_MD5_THREADS` is read by the test
      # and defaults to 1, so the leg above is unaffected by its existence.
      - name: Run MD5 decode parity tests (t=8, tile threading)
        if: (matrix.label == 'safe-simd' || matrix.label == 'safe-simd-arm64') && runner.os == 'Linux'
        env:
          RAV1D_MD5_THREADS: 8
        run: cargo nextest run --profile ci --no-default-features --features "${{ matrix.features }}" --release --test decode_md5_verify

  # ==========================================================================
  # Clippy lint check
  # ==========================================================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # Safe-SIMD build (strict — must pass)
      - name: Clippy (safe-simd)
        run: cargo clippy --no-default-features --features "bitdepth_8,bitdepth_16" -- -D warnings

      # C-FFI build (strict — must pass)
      - name: Clippy (c-ffi)
        run: cargo clippy --no-default-features --features "c-ffi,bitdepth_8,bitdepth_16" -- -D warnings

  # ==========================================================================
  # Format check
  # ==========================================================================
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ==========================================================================
  # Cross-compile checks (build only, no tests)
  # ==========================================================================
  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - wasm32-wasip1
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Check (aarch64)
        if: contains(matrix.target, 'aarch64')
        run: cargo check --target ${{ matrix.target }} --no-default-features --features "bitdepth_8,bitdepth_16"
      - name: Check (wasm32 simd128)
        if: contains(matrix.target, 'wasm32')
        run: RUSTFLAGS="-Ctarget-feature=+simd128" cargo check --target ${{ matrix.target }} --no-default-features --features "bitdepth_8,bitdepth_16"
      - name: Build (non-aarch64, non-wasm)
        if: "!contains(matrix.target, 'aarch64') && !contains(matrix.target, 'wasm32')"
        run: cargo build --target ${{ matrix.target }} --no-default-features --features "bitdepth_8,bitdepth_16"

  # ==========================================================================
  # Token permutation tests (exercises all SIMD tiers)
  # ==========================================================================
  permutation-tests:
    name: SIMD Permutation Tests (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          # A permutation gate that only runs on x86_64 cannot see a defect in
          # any `*_arm.rs` dispatcher — those files do not exist on that target.
          # `ubuntu-24.04-arm` is a native aarch64 runner (so is `macos-latest`).
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Run unit permutation tests
        # nextest isolates each test in its own process, so the old
        # --test-threads=1 race-avoidance is no longer needed.
        run: cargo nextest run --profile ci --no-default-features --features "bitdepth_8,bitdepth_16" --release --lib -E 'test(token_permutation)'

  # ==========================================================================
  # Conformance: MD5 parity across all CPU tiers and bit depths
  # ==========================================================================
  conformance:
    name: Conformance (decode permutations, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            timeout: 30
          # THE aarch64 LEG IS LOAD-BEARING — do not drop it back to a single
          # x86_64 runner. `decode_permutations` is the only gate on
          # "every archmage token permutation decodes bit-identically", and the
          # NEON dispatchers it covers (`src/safe_simd/*_arm.rs`) are compiled
          # out on x86_64. While this job was x86_64-only, 16 of its 19 tests
          # were failing on aarch64 (`Arm64::summon().unwrap()` panics in
          # mc_arm / filmgrain_arm) and CI could not see it.
          # `macos-latest` is also an aarch64 runner if this one is unavailable.
          - os: ubuntu-24.04-arm
            arch: aarch64
            # The scalar tier now really runs the whole 8-bit/data corpus here
            # (before the fix it panicked out in milliseconds). 605 s wall for
            # the full 19 tests on an M-series box; give the slower Neoverse
            # runner room.
            timeout: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Download test vectors
        run: |
          if [ ! -d test-vectors/dav1d-test-data ]; then
            git clone --depth 1 https://code.videolan.org/videolan/dav1d-test-data.git test-vectors/dav1d-test-data
          fi
      - name: Run conformance (all vectors × all CPU tiers)
        # Each per-tier test runs in its own process, so switching the global
        # CPU-flags mask can't race across tests (no --test-threads=1 needed).
        run: cargo nextest run --profile ci --no-default-features --features "bitdepth_8,bitdepth_16" --release --test decode_permutations
        timeout-minutes: ${{ matrix.timeout }}

  # ==========================================================================
  # Guard-extent gate: the bounds map's standing invariant, in RELEASE
  # ==========================================================================
  #
  # `include/dav1d/picture.rs::note_pic_extent` compiles under
  # `debug_assertions` OR `--features probe-sites`, so plain `cargo test`
  # already carries it. This job runs it in RELEASE over the whole corpus,
  # which is the only configuration where the decoder is fast enough to reach
  # the ~575 M reservations the per-file maxima were measured over — a debug
  # decode of the same set is ~50-100x slower.
  #
  # Its own job for the same reason `wide-path-gate` has one: it is the ONLY
  # gate on "nobody widened a picture-plane reservation", the failure it
  # prevents is rare and data-dependent (2-16 collisions across 1406 corpus
  # frames for a ~124 B widening, ZERO on either 4K gap vector), and folding it
  # into a broader job is how a gate goes quiet. `-- --nocapture` is
  # load-bearing: the per-file table it prints IS the evidence for the ceilings
  # in `PIC_EXTENT_CEILINGS`, and the next person raising one needs to see it.
  extent-gate:
    name: Guard-extent gate (bounds map invariant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download test vectors
        run: |
          if [ ! -d test-vectors/dav1d-test-data ]; then
            git clone --depth 1 https://code.videolan.org/videolan/dav1d-test-data.git test-vectors/dav1d-test-data
          fi
      - name: Extent budget over committed vectors + the dav1d corpus
        env:
          # Caller-side skip control, per the no-graceful-skips rule: the test
          # body never decides to skip the corpus leg, this line does.
          RAV1D_EXTENT_GATE_CORPUS: "1"
        run: cargo test --release --features probe-sites --test guard_extent_budget -- --nocapture
        timeout-minutes: 30

  # ==========================================================================
  # Threading: tile threading under forbid(unsafe_code)
  # ==========================================================================
  threading:
    name: Tile Threading
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download test vectors
        run: |
          if [ ! -d test-vectors/dav1d-test-data ]; then
            git clone --depth 1 https://code.videolan.org/videolan/dav1d-test-data.git test-vectors/dav1d-test-data
          fi
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Build threading tests
        run: cargo nextest run --no-default-features --features "bitdepth_8,bitdepth_16" --release --test reproduce_overlap --no-run
        timeout-minutes: 15
      - name: Run threading tests (tile threading, checked mode)
        # The heavy-threading test-group in .config/nextest.toml caps these to
        # one at a time (each spawns its own worker pool), preserving the old
        # --test-threads=1 behavior while keeping per-test process isolation.
        run: |
          cargo nextest run --profile ci --no-default-features --features "bitdepth_8,bitdepth_16" --release \
            --test reproduce_overlap --run-ignored ignored-only \
            -E 'test(test_single_obu_tile_threading) | test(test_frame_threading_inter) | test(test_frame_threading_allintra) | test(test_single_obu_frame_threading)'
        timeout-minutes: 5

  # ==========================================================================
  # Threading race gates (the zenavif#30 / #445 defect class).
  #
  # These suites were written as regression gates for the tile-threading
  # guard-race and worker-panic-wedge bugs, but were only runnable by hand
  # (`just test-threading-races`) — CI never invoked them, which is how #445's
  # bug survived with a gate that "existed". tile_threading_overlap and
  # worker_panic_recovery are self-contained (committed crash vectors / an
  # induced panic); mt_stress_4k needs a 4K multi-tile AVIF, synthesized here
  # so the gate runs on every push instead of only on boxes that happen to
  # have the gitignored bench asset.
  # ==========================================================================
  threading-race-gates:
    name: Threading race gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Guard-race and overlap gates (committed crash vectors)
        run: |
          cargo nextest run --profile ci --no-default-features --features "bitdepth_8,bitdepth_16" --release \
            --test tile_threading_overlap --run-ignored ignored-only
        timeout-minutes: 15
      - name: Worker-panic recovery gates (decode must fail, not wedge)
        run: |
          cargo nextest run --profile ci --no-default-features --features "bitdepth_8,bitdepth_16,__test_induce_worker_panic" --release \
            --test worker_panic_recovery --run-ignored ignored-only
        timeout-minutes: 10
      - name: Synthesize the 4K multi-tile mt_stress vector
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libavif-bin imagemagick
          mkdir -p test-vectors/bench
          convert -size 3840x2561 -seed 7 plasma:fractal png24:/tmp/src4k.png
          avifenc -q 60 -s 8 -y 420 --tilecolslog2 2 --tilerowslog2 1 /tmp/src4k.png test-vectors/bench/photo_4k.avif
          ls -la test-vectors/bench/
        timeout-minutes: 10
      - name: mt_stress_4k (threads 1..16 x 5 trials)
        run: |
          cargo nextest run --profile ci --no-default-features --features "bitdepth_8,bitdepth_16" --release \
            --test mt_stress
        timeout-minutes: 20

  # ==========================================================================
  # Code coverage
  # ==========================================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Generate coverage
        run: cargo llvm-cov nextest --no-default-features --features "bitdepth_8,bitdepth_16" --lib --lcov --output-path lcov.info
      - name: Upload to codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
