name: disjoint-mut CI

on:
  push:
    paths:
      - 'crates/rav1d-disjoint-mut/**'
      - '.github/workflows/disjoint-mut-ci.yml'
  pull_request:
    paths:
      - 'crates/rav1d-disjoint-mut/**'
      - '.github/workflows/disjoint-mut-ci.yml'

env:
  CARGO_TERM_COLOR: always

# Superseded runs only waste runner queue — particularly the macOS
# jobs, which wait on GitHub's scarcest pool. Only the newest
# commit's run matters per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: ["", "--no-default-features"]
        args: [""]
        include:
          # NOT `--all-features`. Several `__probe_*` features are throwaway
          # measurement instruments that DELIBERATELY disable tracking
          # (`__probe_untracked` sets `tracker: None`; `__probe_addnop` keeps
          # the call and deletes the work; `__probe_noscan`/`__probe_tinynop`
          # likewise). Enabling them all at once selects mutually exclusive
          # trackers, so `test_new_always_tracked` and `test_overlapping_mut`
          # fail BY CONSTRUCTION -- that leg was red on main and could never
          # have been green. It tested a configuration nothing ships.
          # This enables the sound COUNTING probes instead, which is the
          # coverage the leg was presumably meant to give.
          #
          # `--lib` is load-bearing. `tests/wide_exclusion.rs` races a wide
          # registrant against narrow ones, and its anti-vacuity assertion
          # fails when the wide side loses nearly every round. The counting
          # probes perturb scheduling enough to cause exactly that on a shared
          # runner ("the wide registrant was refused almost every round (193);
          # the race window was never exercised"). That is the gate WORKING --
          # it refuses to report green when it cannot exercise what it exists
          # to exercise -- so the fix is to not run it under instrumentation,
          # not to loosen it. It has its own dedicated job below, uninstrumented.
          - os: ubuntu-latest
            features: "--features std,__probe_count,__probe_sites"
            args: "--lib"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p rav1d-disjoint-mut ${{ matrix.features }} ${{ matrix.args }}

  # The wide-path lock-ordering TOCTOU (4af62ae) has exactly ONE gate:
  # tests/wide_exclusion.rs. It went VACUOUS once before — c5d1b00 set
  # SHARDS_SERIAL = 1, so the test's instance got a single shard, took `add`'s
  # one-lock fast path, and never reached the wide path at all. Its liveness
  # assertions did not catch that (they count GRANTED borrows, which a
  # single-shard instance grants fine), and with the TOCTOU hazard planted,
  # wide_exclusion + soundness (25) + shard_liveness (5) ALL PASSED on main.
  # There was no gate for that hazard for as long as that held.
  #
  # `__probe_wide` turns on the promotion counters and the assertion that
  # promotions actually occurred, so a future change that silently routes this
  # test away from the wide path fails here instead of going quiet.
  wide-path-gate:
    name: Wide-path exclusion gate (non-vacuous)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p rav1d-disjoint-mut --features __probe_wide --test wide_exclusion -- --nocapture

  # Miri is the ONLY thing in this repo that checks the aliasing model rather
  # than the tracker's own bookkeeping. `rav1d-disjoint-mut` has ~65 `unsafe`
  # uses and no `forbid(unsafe_code)`; the borrow tracker is what makes them
  # sound, and Miri is what says whether the references it hands out obey the
  # model. It found the guards' by-value-move defect (#477) that every tracker
  # test and all 766 corpus vectors missed.
  miri:
    # `matrix.model` is an object, so `${{ matrix.model }}` renders "Object" for
    # BOTH legs and a failure cannot be attributed to a memory model. In run
    # 31292996318 one leg was `failure` and the other `cancelled` and there was
    # no way to tell which model found the UB.
    name: Miri (${{ matrix.model.name }})
    runs-on: ubuntu-latest
    strategy:
      # Same reason: one model failing must not cancel the other's evidence.
      fail-fast: false
      matrix:
        model:
          - name: "Stacked Borrows"
            flags: ""
          - name: "Tree Borrows"
            flags: "-Zmiri-tree-borrows"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # `--no-fail-fast` is load-bearing. Miri aborts the process on the first
      # UB, and cargo stops at the first failing test TARGET — so in run
      # 31292996318 the abort in `narrow_release` meant `soundness`,
      # `shard_liveness`, `wide_exclusion`, `aligned_miri` and
      # `pic_buf_overflow` never ran at all, and their silence was mistaken for
      # health. With this flag every target reports.
      - run: cargo +nightly miri test -p rav1d-disjoint-mut --no-fail-fast
        env:
          MIRIFLAGS: ${{ matrix.model.flags }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -p rav1d-disjoint-mut -- --check
      - run: cargo clippy -p rav1d-disjoint-mut -- -D warnings
      - run: cargo clippy -p rav1d-disjoint-mut --no-default-features -- -D warnings

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - run: cargo check -p rav1d-disjoint-mut
      - run: cargo check -p rav1d-disjoint-mut --no-default-features

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc -p rav1d-disjoint-mut --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
