name: disjoint-mut CI

on:
  push:
    paths:
      - 'crates/rav1d-disjoint-mut/**'
      - '.github/workflows/disjoint-mut-ci.yml'
      - 'scripts/review-disjoint-032.py'
  pull_request:
    paths:
      - 'crates/rav1d-disjoint-mut/**'
      - '.github/workflows/disjoint-mut-ci.yml'
      - 'scripts/review-disjoint-032.py'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: ["", "--no-default-features"]
        include:
          - os: ubuntu-latest
            features: "--all-features"
          - os: ubuntu-latest
            features: "--no-default-features --features aligned,pic-buf,zerocopy"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p rav1d-disjoint-mut ${{ matrix.features }} --all-targets --no-fail-fast
      - run: cargo test -p rav1d-disjoint-mut ${{ matrix.features }} --doc

  protocol:
    name: 0.3 tracker Loom protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p rav1d-disjoint-mut --lib loom_032 -- --test-threads=1
        env:
          RUSTFLAGS: --cfg disjoint_mut_loom
          CARGO_TARGET_DIR: target/loom

  semver:
    name: Published 0.3.1 API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - run: cargo semver-checks -p rav1d-disjoint-mut --baseline-version 0.3.1 --release-type patch --only-explicit-features --features std,instrument,aligned,pic-buf,zerocopy
      - run: cargo semver-checks -p rav1d-disjoint-mut --baseline-version 0.3.1 --release-type patch --only-explicit-features

  miri:
    name: Miri (${{ matrix.model.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model:
          - name: "Stacked Borrows"
            flags: ""
          - name: "Tree Borrows"
            flags: "-Zmiri-tree-borrows"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo +nightly miri test -p rav1d-disjoint-mut --all-features --no-fail-fast
        env:
          MIRIFLAGS: ${{ matrix.model.flags }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -p rav1d-disjoint-mut -- --check
      - run: cargo clippy -p rav1d-disjoint-mut -- -D warnings
      - run: cargo clippy -p rav1d-disjoint-mut --no-default-features -- -D warnings

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - run: cargo check -p rav1d-disjoint-mut
      - run: cargo check -p rav1d-disjoint-mut --no-default-features

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc -p rav1d-disjoint-mut --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
