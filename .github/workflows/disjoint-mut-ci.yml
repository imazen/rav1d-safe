name: disjoint-mut CI

on:
  push:
    paths:
      - 'crates/rav1d-disjoint-mut/**'
      - '.github/workflows/disjoint-mut-ci.yml'
  pull_request:
    paths:
      - 'crates/rav1d-disjoint-mut/**'
      - '.github/workflows/disjoint-mut-ci.yml'

env:
  CARGO_TERM_COLOR: always

# Superseded runs only waste runner queue — particularly the macOS
# jobs, which wait on GitHub's scarcest pool. Only the newest
# commit's run matters per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: ["", "--no-default-features"]
        include:
          - os: ubuntu-latest
            features: "--all-features"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p rav1d-disjoint-mut ${{ matrix.features }}

  # The wide-path lock-ordering TOCTOU (4af62ae) has exactly ONE gate:
  # tests/wide_exclusion.rs. It went VACUOUS once before — c5d1b00 set
  # SHARDS_SERIAL = 1, so the test's instance got a single shard, took `add`'s
  # one-lock fast path, and never reached the wide path at all. Its liveness
  # assertions did not catch that (they count GRANTED borrows, which a
  # single-shard instance grants fine), and with the TOCTOU hazard planted,
  # wide_exclusion + soundness (25) + shard_liveness (5) ALL PASSED on main.
  # There was no gate for that hazard for as long as that held.
  #
  # `__probe_wide` turns on the promotion counters and the assertion that
  # promotions actually occurred, so a future change that silently routes this
  # test away from the wide path fails here instead of going quiet.
  wide-path-gate:
    name: Wide-path exclusion gate (non-vacuous)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p rav1d-disjoint-mut --features __probe_wide --test wide_exclusion -- --nocapture

  miri:
    name: Miri (${{ matrix.model }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model:
          - name: "Stacked Borrows"
            flags: ""
          - name: "Tree Borrows"
            flags: "-Zmiri-tree-borrows"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo +nightly miri test -p rav1d-disjoint-mut
        env:
          MIRIFLAGS: ${{ matrix.model.flags }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -p rav1d-disjoint-mut -- --check
      - run: cargo clippy -p rav1d-disjoint-mut -- -D warnings
      - run: cargo clippy -p rav1d-disjoint-mut --no-default-features -- -D warnings

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - run: cargo check -p rav1d-disjoint-mut
      - run: cargo check -p rav1d-disjoint-mut --no-default-features

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc -p rav1d-disjoint-mut --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
