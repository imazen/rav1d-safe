[package]
name = "rav1d-safe-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[features]
# Differential-fuzz target requires libdav1d >= 1.3 (pkg-config). Ubuntu
# 22.04 ships 0.9.2; install a newer build (e.g., from source via meson+ninja)
# before enabling. The other fuzz targets do not need this dep.
differential = ["dep:dav1d"]

[dependencies]
libfuzzer-sys = "0.4"
dav1d = { version = "0.11.1", optional = true }

[dependencies.rav1d-safe]
path = ".."
default-features = false
features = ["bitdepth_8", "bitdepth_16"]

[[bin]]
name = "decode_obu"
path = "fuzz_targets/decode_obu.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_seq_header"
path = "fuzz_targets/parse_seq_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential_dav1d"
path = "fuzz_targets/differential_dav1d.rs"
test = false
doc = false
bench = false
required-features = ["differential"]
