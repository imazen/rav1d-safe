[package]
name = "rav1d-disjoint-mut"
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
description = "Runtime-checked concurrent disjoint mutable access to contiguous storage"
license = "BSD-2-Clause OR MIT OR Apache-2.0"
repository = "https://github.com/imazen/rav1d-safe"
documentation = "https://docs.rs/rav1d-disjoint-mut"
keywords = ["concurrency", "mutex", "slice", "disjoint", "borrow"]
categories = ["concurrency", "no-std", "data-structures"]
exclude = [
    "justfile",
    "CLAUDE.md",
    "CONTEXT-HANDOFF.md",
    "FEEDBACK.md",
    ".claude/",
    ".superwork/",
    ".zenbench/",
    "copter-report/",
    ".github/",
    "Cross.toml",
    "Cargo.toml.original.txt",
    "fuzz/",
    "tests/",
    "benches/",
]

[features]
default = ["std"]
# Benchmark tooling needs Rust 1.86; keep it out of MSRV API tests.
__bench = ["dep:criterion"]
std = []
# Runtime borrow instrumentation (records size histograms, concurrency, contention).
instrument = ["std"]
# Internal measurement features: opt-in and outside the supported API.
__probe_count = ["std"]
# Overlap tracking OFF; slice bounds checks stay ON. Overlapping borrows become
# undefined behaviour in the Rust memory model (aliasing / data races). Every
# element type is `PlainData`, so a load always yields a VALID value (never an
# invalid enum, reference or niche) and bounds stay enforced; the memory-model UB
# itself is not removed. See `PlainData` and the crate README. Opt-in; unifies
# across the whole dependency graph.
untracked = []
# Wide-path reason counters. Unlike __probe_count this KEEPS the sharded tracker.
__probe_wide = ["std"]
# Thread-local usage census; retains production tracking, diagnostic timings only.
__probe_usage = ["std"]
# THROWAWAY per-call-site borrow COUNTS (keeps the sharded tracker).
__probe_sites = ["std"]
# THROWAWAY guard-extent / footprint / concurrency map. Implies __probe_sites so
# both instruments run in ONE binary and reconcile registration for
# registration. Internal diagnostic; absent from `default` and from every supported
# feature. See src/bounds_probe.rs.
__probe_bounds = ["std", "__probe_sites"]
# Aligned newtypes (Align4..64) and AlignedVec32/64 for SIMD-friendly layout.
aligned = ["dep:aligned", "dep:aligned-vec"]
# PicBuf: owned/borrowed byte buffer for DisjointMut (used by rav1d picture data).
pic-buf = []

[dependencies]
spin = { version = "0.12.3", default-features = false, features = ["once"] }
aligned = { version = "0.4.3", default-features = false, optional = true }
aligned-vec = { version = "0.6.4", default-features = false, optional = true }
zerocopy = { version = "0.8.56", default-features = false }

criterion = { version = "0.8.2", default-features = false, optional = true }

# Instrument the production tracker only in the dedicated model-checking build.
# A cfg rather than a Cargo feature prevents feature unification from replacing
# application synchronization with Loom's model runtime.
[target.'cfg(disjoint_mut_loom)'.dependencies]
loom = "0.7.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(disjoint_mut_loom)'] }

[[bench]]
name = "lock_overhead"
harness = false
required-features = ["__bench"]
