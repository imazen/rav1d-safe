[package]
name = "rav1d-release-profile-current"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rav1d-safe = { path = "/home/lilith/work/zen/rav1d-safe" }
md5 = "=0.8.0"
rav1d-disjoint-mut = { path = "/home/lilith/work/zen/rav1d-safe/crates/rav1d-disjoint-mut" }

[features]
unchecked = ["rav1d-safe/unchecked"]
asm = ["rav1d-safe/asm"]
tracker-off = ["rav1d-safe/__probe_untracked"]
asm-tracker-off = ["rav1d-safe/asm", "rav1d-safe/__probe_untracked"]
__probe_usage = ["rav1d-safe/__probe_usage"]
__probe_wide = ["rav1d-safe/__probe_wide"]
__probe_tasktime = []

[profile.release]
codegen-units = 1
lto = "fat"
debug = "line-tables-only"
strip = false
panic = "unwind"
